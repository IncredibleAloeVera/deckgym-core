[package]
name = "deckgym"
version = "0.1.0"
edition = "2021"
default-run = "deckgym"
description = "A high-performance Rust library for simulating Pokémon TCG Pocket games."

[dependencies]
rand = "0.8"
lazy_static = "1.4"
clap = { version = "4.5.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` because the default parser is ~1 ulp lossy: it *writes* the 17 significant
# digits correctly and reads them back to a neighbouring f64. §1.5.2's rating table and §1.5.5's
# loop counters travel as JSON, and a checkpoint that does not restore the value it saved makes
# "two resumes from one checkpoint agree" false by an amount nobody would ever think to look for.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
log = "0.4.22"
env_logger = "0.11.6"
colored = "3"
chrono = "0.4.39"
indexmap = "2.7.0"
num-format = "0.4.4"
humantime = "2.1.0"
uuid = { version = "1.17.0", features = ["v4", "js"] }
indicatif = "0.18.2"
rayon = "1.10"
# Graceful interruption for the RL training loop (RL_ARCHITECTURE 1.5.5 checkpointing): std has
# no signal API, and a run that only checkpoints on a batch cadence loses everything since the
# last autosave on Ctrl-C.
ctrlc = { version = "3.4", optional = true }
# The magnet's reservoir (RL_ARCHITECTURE 1.5.1b) rides in the hot checkpoint. JSON would be the
# only encoder already here and it is the wrong one: 50 000 observations of mostly-numeric structs
# write an order of magnitude larger and slower than the model beside them, which is what made the
# buffer look too expensive to persist in the first place.
rmp-serde = { version = "1.3", optional = true }
csv = { version = "1.3.1", optional = true }
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
strum = "0.27"
strum_macros = "0.27"
ratatui = { version = "0.28", optional = true }
crossterm = { version = "0.28", optional = true }
burn = { version = "0.21", default-features = false, features = [
    "std",
    "ndarray",
], optional = true }

[features]
default = []
test-utils = []
python = ["pyo3"]
tui = ["ratatui", "dep:crossterm"]
csv-export = ["csv"]
# Part 4 model (RL_ARCHITECTURE §1.4) and the Part 5 training loop (§1.5). Off by default
# so the pure simulator build never pays for the deep-learning stack. Autodiff is part of
# it, not an extra: §1.5.1's learner is a gradient step, so the CPU build has to be able to
# take one.
rl-model = [
    "dep:burn",
    "burn/autodiff",
    "dep:ctrlc",
    "dep:crossterm",
    "dep:rmp-serde",
]
# GPU backends for the latency sweeps (§1.4.3) and for training at the §1.5.5 env counts.
rl-model-wgpu = ["rl-model", "burn/wgpu"]
rl-model-cuda = ["rl-model", "burn/cuda"]

[lib]
name = "deckgym"
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }

[[bench]]
name = "play_benchmark"
harness = false

[[bench]]
name = "card_lookup_benchmark"
harness = false

[[bench]]
name = "rare_candy_benchmark"
harness = false

[[bin]]
name = "tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "temp_deck_generator"
path = "src/bin/temp_deck_generator.rs"

[[example]]
name = "sylveon_deck_draw_speed"
required-features = ["csv-export"]

[[example]]
name = "train_player"
required-features = ["rl-model"]

[[example]]
name = "bake_model"
required-features = ["rl-model"]
